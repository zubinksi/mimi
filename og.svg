<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style type="text/css"><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&display=swap');
  ]]></style>

  <radialGradient id="rg1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
    gradientTransform="translate(180,-63) scale(960,630)">
    <stop offset="0%" stop-color="#fde8d8"/>
    <stop offset="60%" stop-color="#fde8d8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rg2" cx="1" cy="1" r="1" gradientUnits="userSpaceOnUse"
    gradientTransform="translate(1140,693) scale(-840,-693)">
    <stop offset="0%" stop-color="#f5dde0"/>
    <stop offset="55%" stop-color="#f5dde0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rg3" cx="1" cy="0" r="1" gradientUnits="userSpaceOnUse"
    gradientTransform="translate(1080,0) scale(-600,630)">
    <stop offset="0%" stop-color="#e8efd9"/>
    <stop offset="60%" stop-color="#e8efd9" stop-opacity="0"/>
  </radialGradient>

  <filter id="tile-shadow" x="-8%" y="-8%" width="116%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#3a2a1f" flood-opacity="0.10"/>
  </filter>
</defs>

<!-- ── Background ── -->
<rect width="1200" height="630" fill="#faf3e7"/>
<rect width="1200" height="630" fill="url(#rg1)"/>
<rect width="1200" height="630" fill="url(#rg2)"/>
<rect width="1200" height="630" fill="url(#rg3)"/>

<!-- Soft divider -->
<line x1="590" y1="60" x2="590" y2="570" stroke="#e8d8c8" stroke-width="1" opacity="0.5"/>

<!-- ── Scattered decorative hearts ── -->
<text x="52"  y="130" font-size="42" fill="#e8a4a4" opacity="0.55">♥</text>
<text x="490" y="90"  font-size="26" fill="#c97070" opacity="0.40">♥</text>
<text x="72"  y="560" font-size="30" fill="#d99070" opacity="0.50">♥</text>
<text x="460" y="590" font-size="20" fill="#a8bf9a" opacity="0.55">♥</text>
<text x="140" y="490" font-size="18" fill="#c97070" opacity="0.28">♥</text>

<!-- ── LEFT HALF: two lines of text, vertically centered ── -->

<!-- "For Mimi" -->
<text x="303" y="270"
  text-anchor="middle"
  font-family="'Fraunces', Georgia, serif"
  font-weight="500"
  font-size="88"
  letter-spacing="-1"
  fill="#3a2a1f">For Mimi</text>

<!-- "with all my love, Zach ♡" -->
<text x="303" y="390"
  text-anchor="middle"
  font-family="'Fraunces', Georgia, serif"
  font-style="italic"
  font-weight="500"
  font-size="44"
  fill="#6b5340">with all my love, <tspan font-weight="600" fill="#3a2a1f">Zach</tspan> ♡</text>

<!-- ── RIGHT HALF: 4×4 tile grid, all cream ── -->
<!-- tileW=118  tileH=106  colStep=128  rowStep=116 -->
<!-- Cols: 632 760 888 1016  |  Rows: 82 198 314 430 -->

<!-- ROW 0 -->
<rect x="632" y="82" width="118" height="106" rx="14" fill="#fffaf0" stroke="#e8dcc8" stroke-width="1" filter="url(#tile-shadow)"/>
<text x="691" y="140" text-anchor="middle" dominant-baseline="middle"
  font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="14"
  letter-spacing="2" fill="#3a2a1f">MAMA</text>

