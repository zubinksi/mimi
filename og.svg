<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style type="text/css"><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');
  ]]></style>

  <!-- Background gradients -->
  <radialGradient id="rg1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
    gradientTransform="translate(180,-63) scale(960,630)">
    <stop offset="0%" stop-color="#fde8d8"/>
    <stop offset="60%" stop-color="#fde8d8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rg2" cx="1" cy="1" r="1" gradientUnits="userSpaceOnUse"
    gradientTransform="translate(1140,693) scale(-840,-693)">
    <stop offset="0%" stop-color="#f5dde0"/>
    <stop offset="55%" stop-color="#f5dde0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rg3" cx="1" cy="0" r="1" gradientUnits="userSpaceOnUse"
    gradientTransform="translate(1080,0) scale(-600,630)">
    <stop offset="0%" stop-color="#e8efd9"/>
    <stop offset="60%" stop-color="#e8efd9" stop-opacity="0"/>
  </radialGradient>

  <!-- Tile drop shadow -->
  <filter id="tile-shadow" x="-8%" y="-8%" width="116%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#3a2a1f" flood-opacity="0.10"/>
  </filter>
  <!-- Selected tile glow -->
  <filter id="sel-shadow" x="-8%" y="-8%" width="116%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#3a2a1f" flood-opacity="0.22"/>
  </filter>
</defs>

<!-- ── Background ── -->
<rect width="1200" height="630" fill="#faf3e7"/>
<rect width="1200" height="630" fill="url(#rg1)"/>
<rect width="1200" height="630" fill="url(#rg2)"/>
<rect width="1200" height="630" fill="url(#rg3)"/>

<!-- Soft divider between halves -->
<line x1="590" y1="60" x2="590" y2="570" stroke="#e8d8c8" stroke-width="1" opacity="0.5"/>

<!-- ── Scattered decorative hearts (left area) ── -->
<text x="52"  y="112" font-size="38" fill="#e8a4a4" opacity="0.55">♥</text>
<text x="505" y="82"  font-size="22" fill="#c97070" opacity="0.40">♥</text>
<text x="78"  y="568" font-size="28" fill="#d99070" opacity="0.50">♥</text>
<text x="472" y="598" font-size="18" fill="#a8bf9a" opacity="0.55">♥</text>
<text x="148" y="488" font-size="16" fill="#c97070" opacity="0.30">♥</text>
<text x="525" y="530" font-size="14" fill="#e8a4a4" opacity="0.40">♥</text>
<text x="100" y="200" font-size="12" fill="#c99e2a" opacity="0.35">♥</text>

<!-- ── LEFT HALF: Text content ── -->

<!-- Eyebrow -->
<text x="303" y="148"
  text-anchor="middle"
  font-family="'Inter', Arial, sans-serif"
  font-weight="600"
  font-size="12"
  letter-spacing="5"
  fill="#6b5340">· FOR MIMI · MOTHER'S DAY 2026 ·</text>

<!-- Title: "A Little" -->
<text x="303" y="248"
  text-anchor="middle"
  font-family="'Fraunces', Georgia, serif"
  font-weight="500"
  font-size="74"
  letter-spacing="-1.5"
  fill="#3a2a1f">A Little</text>

<!-- Title: "Word Puzzle" italic rose -->
<text x="303" y="338"
  text-anchor="middle"
  font-family="'Fraunces', Georgia, serif"
  font-weight="500"
  font-style="italic"
  font-size="74"
  letter-spacing="-1.5"
  fill="#c97070">Word Puzzle</text>

<!-- Decorative rule -->
<line x1="118" y1="370" x2="488" y2="370" stroke="#e8a4a4" stroke-width="1.5" opacity="0.65"/>

<!-- Subtitle lines -->
<text x="303" y="412"
  text-anchor="middle"
  font-family="'Fraunces', Georgia, serif"
  font-style="italic"
  font-size="22"
  fill="#6b5340">Find four groups of four.</text>
<text x="303" y="444"
  text-anchor="middle"
  font-family="'Fraunces', Georgia, serif"
  font-style="italic"
  font-size="22"
  fill="#6b5340">Made just for you, Mimi.</text>

<!-- Signature -->
<text x="303" y="545"
  text-anchor="middle"
  font-family="'Fraunces', Georgia, serif"
  font-style="italic"
  font-size="21"
  fill="#6b5340">with all my love, <tspan
    font-weight="600"
    fill="#3a2a1f">Zach</tspan> ♡</text>

